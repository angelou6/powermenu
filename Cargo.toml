[package]
name = "powermenu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", features = ["preserve_order"] }
